name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Typecheck, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          # Silence Next.js telemetry in CI
          NEXT_TELEMETRY_DISABLED: 1

      - name: Test
        run: npm test

  commit-hygiene:
    name: commit-hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch full history so we can inspect every commit in the PR range.
          fetch-depth: 0

      - name: Check commits in PR range
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            # On push to main, check only the pushed commit(s).
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi

          # Guard: on the first push of a new branch, 'before' is the zero SHA.
          # Fall back to the repo's root commit so the full branch is checked.
          if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="$(git rev-list --max-parents=0 HEAD)"
          fi

          FAIL=0
          # --no-merges skips merge commits; their messages are auto-generated
          # and irrelevant, and including them risks scanning already-checked commits
          # when force-pushes shift the BASE ref.
          while IFS= read -r hash; do
            MSG="$(git log -1 --format="%B" "$hash")"
            SHORT="$(git log -1 --format="%h %s" "$hash")"

            if echo "$MSG" | grep -qiE "co-authored-by:"; then
              echo "ERROR: $SHORT — contains Co-authored-by trailer" >&2
              FAIL=1
            fi
            if echo "$MSG" | grep -qiE "claude-session:"; then
              echo "ERROR: $SHORT — contains Claude-Session trailer" >&2
              FAIL=1
            fi
            # Match the actual Claude Code footer ("🤖 Generated with [Claude Code]...")
            # and similar AI-tool footers; tightened to avoid false positives on prose.
            if echo "$MSG" | grep -qiE "generated with (claude|copilot|chatgpt|openai|gemini|gpt)"; then
              echo "ERROR: $SHORT — contains AI-tool attribution footer" >&2
              FAIL=1
            fi
          done < <(git log --no-merges --format="%H" "${BASE}..${HEAD}")

          exit $FAIL

      - name: Check PR body
        if: github.event_name == 'pull_request'
        run: |
          # Read the PR body from the event JSON to avoid YAML injection
          # from special characters (quotes, backticks, newlines) in the body.
          PR_BODY="$(jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH")"
          FAIL=0
          if echo "$PR_BODY" | grep -qiE "co-authored-by:"; then
            echo "ERROR: PR body contains Co-authored-by trailer" >&2
            FAIL=1
          fi
          if echo "$PR_BODY" | grep -qiE "claude-session:"; then
            echo "ERROR: PR body contains Claude-Session trailer" >&2
            FAIL=1
          fi
          if echo "$PR_BODY" | grep -qiE "generated with (claude|copilot|chatgpt|openai|gemini|gpt)"; then
            echo "ERROR: PR body contains AI-tool attribution footer" >&2
            FAIL=1
          fi
          exit $FAIL
